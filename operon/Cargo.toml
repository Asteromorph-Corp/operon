[package]
name = "operon"
description = "A workflow engine for parallel, incremental scheduling of DAG-defined multiplex tasks."
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ansi_term = "0.12.1"
async-trait = "0.1.80"
bytes = "1"
chrono = "0.4.16"
clap = { version = "4.0.1", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
csv = "1.2.1"
deadpool-postgres = "0.14"
futures = "0.3"
indexmap = "2"
operon-macros.workspace = true
postgres-types = { version = "0.2.5", features = ["derive"] }
ratatui = "0.29"
secrecy = "0.10.1"
serde = { version = "1.0.60", features = ["derive"] }
serde_json = "1"
textwrap = "0.16"
thiserror = "2"
tracing = "0.1.37"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["registry"] }
tokio = { version = "1.37.0", features = ["full"] }
tokio-postgres = { version = "0.7.9", features = [
    "with-chrono-0_4",
    "with-serde_json-1",
    "with-uuid-1",
] }
twox-hash = { version = "2", default-features = false, features = ["std", "xxhash3_64"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs"] }

[dev-dependencies]
indoc = "2"
pretty_assertions = "1"
rstest = "0.26"
log = "0.4.29"
rand = "0.9.1"

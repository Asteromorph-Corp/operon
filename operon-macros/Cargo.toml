[package]
name = "operon-macros"
description = "Procedural macros for the Operon workflow engine."
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
heck = "0.5.0"
indexmap = { version = "2", features = ["serde"] }
indoc = "2"
once_cell = "1.13.0"
proc-macro-crate = "3.2.0"
proc-macro-error = "1"
proc-macro2 = "1.0.86"
quote = "1.0.37"
syn = { version = "2.0.87", features = ["full", "extra-traits"] }

[dev-dependencies]
pretty_assertions = "1"
prettyplease = "0.2"
rstest = "0.26"

name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

  # All workspace members:
  CARGO_PACKAGE_ARGS: "--workspace"

  # Or selected packages only:
  # CARGO_PACKAGE_ARGS: "--package my-core --package my-cli"

  # Or all except helper crates:
  # CARGO_PACKAGE_ARGS: "--workspace --exclude xtask"

jobs:
  fmt:
    name: fmt
    runs-on: self-hosted
    steps:
      # Optional, uncomment if disk space pressure is observed.
      # - name: Free disk space
      #   uses: jlumbroso/free-disk-space@v1.3.1
      #   with:
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: true
      #     docker-images: true
      #     swap-storage: true
      #     tool-cache: false

      - uses: actions/checkout@v7

      - name: Read pinned nightly toolchain
        run: echo "NIGHTLY_TOOLCHAIN=$(<.github/nightly-toolchain)" >> "$GITHUB_ENV"

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: rustfmt

      - name: Configure Cargo auth
        env:
          KELLNR_REGISTRY_URL: ${{ secrets.KELLNR_REGISTRY_URL }}
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [registries.kellnr]
          index = "sparse+https://${KELLNR_REGISTRY_URL}/api/v1/crates/"
          credential-provider = ["cargo:token"]
          EOF

      - name: Check formatting
        run: cargo +$NIGHTLY_TOOLCHAIN fmt --all -- --check

  doc:
    name: doc / ${{ matrix.name }}
    runs-on: self-hosted
    env:
      CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_READONLY_TOKEN }}
    needs: fmt

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          # Optional, uncomment if your crate has default features.
          # - name: no-default-features
          #   args: "--no-default-features"
          # Optional, uncomment if your crate has optional features.
          # - name: all-features
          #   args: "--all-features"

    steps:
      # Optional, uncomment if disk space pressure is observed.
      # - name: Free disk space
      #   uses: jlumbroso/free-disk-space@v1.3.1
      #   with:
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: true
      #     docker-images: true
      #     swap-storage: true
      #     tool-cache: false

      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo auth
        env:
          KELLNR_REGISTRY_URL: ${{ secrets.KELLNR_REGISTRY_URL }}
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [registries.kellnr]
          index = "sparse+https://${KELLNR_REGISTRY_URL}/api/v1/crates/"
          credential-provider = ["cargo:token"]
          EOF

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: doc-${{ matrix.name }}

      - name: Check documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc $CARGO_PACKAGE_ARGS --locked --no-deps --document-private-items ${{ matrix.args }}

  test:
    name: test / ${{ matrix.name }}
    runs-on: self-hosted
    env:
      CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_READONLY_TOKEN }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: operon
          POSTGRES_PASSWORD: operon
          POSTGRES_DB: operon
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    needs: fmt

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          # Optional, uncomment if your crate has default features.
          # - name: no-default-features
          #   args: "--no-default-features"
          # Optional, uncomment if your crate has optional features.
          # - name: all-features
          #   args: "--all-features"
          # Any other feature combinations you want to test.
          # - name: core-serde
          #   args: "--no-default-features --features my-core/serde"

    steps:
      # Optional, uncomment if disk space pressure is observed.
      # - name: Free disk space
      #   uses: jlumbroso/free-disk-space@v1.3.1
      #   with:
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: true
      #     docker-images: true
      #     swap-storage: true
      #     tool-cache: false

      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Configure Cargo auth
        env:
          KELLNR_REGISTRY_URL: ${{ secrets.KELLNR_REGISTRY_URL }}
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [registries.kellnr]
          index = "sparse+https://${KELLNR_REGISTRY_URL}/api/v1/crates/"
          credential-provider = ["cargo:token"]
          EOF

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.name }}

      - name: Run cargo clippy
        run: cargo clippy $CARGO_PACKAGE_ARGS --locked --all-targets ${{ matrix.args }} -- -D warnings

      - name: Run tests
        run: cargo test $CARGO_PACKAGE_ARGS --locked --all-targets ${{ matrix.args }}

      - name: Run doc tests
        run: cargo test $CARGO_PACKAGE_ARGS --locked --doc ${{ matrix.args }}

  get-msrv:
    name: Get MSRV
    runs-on: self-hosted
    outputs:
      msrv: ${{ steps.msrv.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - name: Get MSRV
        id: msrv
        uses: SebRollen/toml-action@v1.2.0
        with:
          file: Cargo.toml
          field: workspace.package.rust-version

  msrv:
    name: MSRV / ${{ matrix.name }}
    runs-on: self-hosted
    env:
      CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_READONLY_TOKEN }}
    needs: [fmt, get-msrv]
    if: needs.get-msrv.outputs.msrv != ''

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          # Optional, uncomment if your crate has default features.
          # - name: no-default-features
          #   args: "--no-default-features"
          # Optional, uncomment if your crate has optional features.
          # - name: all-features
          #   args: "--all-features"

    steps:
      # Optional, uncomment if disk space pressure is observed.
      # - name: Free disk space
      #   uses: jlumbroso/free-disk-space@v1.3.1
      #   with:
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: true
      #     docker-images: true
      #     swap-storage: true
      #     tool-cache: false

      - uses: actions/checkout@v7

      - name: Install MSRV Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.get-msrv.outputs.msrv }}

      - name: Configure Cargo auth
        env:
          KELLNR_REGISTRY_URL: ${{ secrets.KELLNR_REGISTRY_URL }}
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [registries.kellnr]
          index = "sparse+https://${KELLNR_REGISTRY_URL}/api/v1/crates/"
          credential-provider = ["cargo:token"]
          EOF

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-${{ matrix.name }}

      # No cargo clippy, because older versions of clippy have different lints and may fail the build for reasons unrelated to the crate.

      - name: Run tests
        run: cargo test $CARGO_PACKAGE_ARGS --locked --all-targets ${{ matrix.args }}

  minimal-versions:
    name: Minimal versions / ${{ matrix.name }}
    runs-on: self-hosted
    env:
      CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_READONLY_TOKEN }}
    needs: fmt

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          # Optional, uncomment if your crate has default features.
          # - name: no-default-features
          #   args: "--no-default-features"
          # Optional, uncomment if your crate has optional features.
          # - name: all-features
          #   args: "--all-features"

    steps:
      # Optional, uncomment if disk space pressure is observed.
      # - name: Free disk space
      #   uses: jlumbroso/free-disk-space@v1.3.1
      #   with:
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: true
      #     docker-images: true
      #     swap-storage: true
      #     tool-cache: false

      - uses: actions/checkout@v7

      - name: Read pinned nightly toolchain
        run: echo "NIGHTLY_TOOLCHAIN=$(<.github/nightly-toolchain)" >> "$GITHUB_ENV"

      # Used to resolve a minimal-versions lockfile.
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Configure Cargo auth
        env:
          KELLNR_REGISTRY_URL: ${{ secrets.KELLNR_REGISTRY_URL }}
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [registries.kellnr]
          index = "sparse+https://${KELLNR_REGISTRY_URL}/api/v1/crates/"
          credential-provider = ["cargo:token"]
          EOF

      - name: Resolve direct minimal-versions lockfile
        run: cargo +$NIGHTLY_TOOLCHAIN generate-lockfile -Z direct-minimal-versions

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: minimal-versions-${{ matrix.name }}

      - name: Run cargo clippy
        run: cargo clippy $CARGO_PACKAGE_ARGS --locked --all-targets ${{ matrix.args }} -- -D warnings

      - name: Run tests
        run: cargo test $CARGO_PACKAGE_ARGS --locked --all-targets ${{ matrix.args }}

      - name: Run doc tests
        run: cargo test $CARGO_PACKAGE_ARGS --locked --doc ${{ matrix.args }}

name: Rust

on:
  push:
    branches: ["main", "next"]
  pull_request:
    branches: ["main", "next"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Configure Cargo auth
        env:
          KELLNR_REGISTRY_URL: ${{ secrets.KELLNR_REGISTRY_URL }}
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [registries.kellnr]
          index = "sparse+https://${KELLNR_REGISTRY_URL}/api/v1/crates/"
          credential-provider = ["cargo:token"]
          EOF

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Run cargo clippy
        env:
          CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_READONLY_TOKEN }}
        run: cargo +stable clippy --workspace --locked --all-features --all-targets -- -D warnings

      - name: Check documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
          CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_READONLY_TOKEN }}
        run: cargo +stable doc --workspace --locked --no-deps --document-private-items

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: operon
          POSTGRES_PASSWORD: operon
          POSTGRES_DB: operon
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo auth
        env:
          KELLNR_REGISTRY_URL: ${{ secrets.KELLNR_REGISTRY_URL }}
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [registries.kellnr]
          index = "sparse+https://${KELLNR_REGISTRY_URL}/api/v1/crates/"
          credential-provider = ["cargo:token"]
          EOF

      - name: Cache test dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Run tests
        env:
          CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_READONLY_TOKEN }}
          POSTGRES_URI: postgres://operon:operon@localhost:5432/operon
        run: cargo test --workspace --locked --all-features --all-targets

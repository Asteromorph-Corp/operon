[package]
name = "operon-macros"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
proc-macro = true

[dependencies]
heck = "0.5.0"
indexmap = { version = "2.9.0", features = ["serde"] }
indoc = "2.0.6"
once_cell = "1.21.3"
proc-macro-crate = "3.3.0"
proc-macro-error = "1.0.4"
proc-macro2 = "1.0.95"
quote = "1.0.40"
serde = { version = "1.0.219", features = ["derive"] }
syn = { version = "2.0.103", features = ["full"] }
toml = "0.8.23"

[dev-dependencies]
syn = { version = "2.0.103", features = ["extra-traits"] }
